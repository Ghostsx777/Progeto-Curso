[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://devpachtacademy.netlify.app"

# Ativar explicitamente o runtime: publicar .next sem ele causa 404 nas rotas.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Segredos: configurar no painel do provedor, nunca neste arquivo.
# Este arquivo não cria um site nem autoriza publicação.
